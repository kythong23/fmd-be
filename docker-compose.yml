services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?thiếu DB_PASSWORD trong .env}
      POSTGRES_DB: fdm
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    env_file: .env
    environment:
      # Đè DATABASE_URL trong .env: trong mạng compose, host của DB là 'db'.
      DATABASE_URL: postgres://postgres:${DB_PASSWORD}@db:5432/fdm
    ports:
      - '${PORT:-2304}:2304'
    volumes:
      # Ảnh nằm ngoài container để sống sót qua mọi lần rebuild.
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
